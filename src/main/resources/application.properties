# ================================================================
#  Bank API — Configuration Application
#  Profil : développement (H2 en mémoire)
# ================================================================

server.port=8080
spring.application.name=bank-api

# ----------------------------------------------------------------
#  BASE DE DONNÉES H2 (en mémoire — profil dev)
#  DB_CLOSE_DELAY=-1  → Garde la BDD en vie tant que le JVM tourne
#  DB_CLOSE_ON_EXIT=FALSE → Pas de fermeture automatique à la sortie
# ----------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ----------------------------------------------------------------
#  JPA / HIBERNATE
#  ddl-auto=create-drop : crée le schéma au démarrage, le détruit à l'arrêt
#  Pour persister entre redémarrages, utiliser "update"
# ----------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Optimisation : initialise le schéma AVANT d'insérer les données SQL
spring.jpa.defer-datasource-initialization=true

# ----------------------------------------------------------------
#  CONSOLE H2 (dev uniquement — à désactiver en production !)
#  Accès : http://localhost:8080/h2-console
#  JDBC URL : jdbc:h2:mem:bankdb
# ----------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ----------------------------------------------------------------
#  SWAGGER / OPENAPI 3
#  Accès : http://localhost:8080/swagger-ui.html
#  Spec JSON : http://localhost:8080/api-docs
# ----------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true

# ----------------------------------------------------------------
#  JACKSON — Sérialisation JSON
#  Désactive l'échec sur les propriétés inconnues (robustesse)
# ----------------------------------------------------------------
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false