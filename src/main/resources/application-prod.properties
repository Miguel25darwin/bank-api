# ================================================================
#  Bank API — Configuration Production (Render)
#  Profil : prod — PostgreSQL géré par Render
# ================================================================

# ----------------------------------------------------------------
#  BASE DE DONNÉES PostgreSQL
#  La variable DATABASE_URL est fournie automatiquement par Render
#  Format : postgres://user:password@host:5432/dbname
# ----------------------------------------------------------------
spring.datasource.url=jdbc:${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------------------------------
#  JPA / HIBERNATE
#  update : ne recrée pas les tables à chaque démarrage (production)
# ----------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ----------------------------------------------------------------
#  DÉSACTIVER LA CONSOLE H2 (non disponible en production)
# ----------------------------------------------------------------
spring.h2.console.enabled=false

# ----------------------------------------------------------------
#  SWAGGER — Conserver pour faciliter les tests post-déploiement
# ----------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true

# ----------------------------------------------------------------
#  JACKSON
# ----------------------------------------------------------------
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false

# ----------------------------------------------------------------
#  LOGGING — Réduire le niveau en production
# ----------------------------------------------------------------
logging.level.org.hibernate.SQL=WARN
logging.level.com.bank=INFO
